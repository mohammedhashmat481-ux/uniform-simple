# Nginx Configuration for Apex Craft Uniforms
# Location: /etc/nginx/sites-available/apexcraft.conf

server {
    listen 80;
    server_name apexcraftuniforms.com www.apexcraftuniforms.com;

    # Redirect HTTP to HTTPS (Configured automatically by Let's Encrypt Certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name apexcraftuniforms.com www.apexcraftuniforms.com;

    # SSL Certificates managed via Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/apexcraftuniforms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apexcraftuniforms.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory for static React frontend build
    root /var/www/apexcraft/dist;
    index index.html;

    # Gzip Compression Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Serve React SPA Frontend (Client-side Routing)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve Uploaded Product Images Directly from Disk with Long Cache
    location /uploads/ {
        alias /var/www/apexcraft/server/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Proxy API Requests to Express Backend (PM2 cluster on port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
